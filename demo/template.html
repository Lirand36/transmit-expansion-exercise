<title>Expansion Priorities Q1 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* A CRO work plan: four plays, the money in each, who owns it. Accounts one click away. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #0f1522;
  --muted: #5a6476;
  --line: #dfe4ec;
  --accent: #1f4bd8;
  --accent-soft: #e6ecfd;
  --t3-soft: #eceff4;
  --warn: #b4410a;
  --warn-soft: #fdebe1;
  --good: #137a4b;
  --good-soft: #def4e8;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f17; --surface: #131a27; --ink: #e7ebf2; --muted: #97a1b3; --line: #253045;
    --accent: #7d97ff; --accent-soft: #1c2647; --t3-soft: #1e2635;
    --warn: #ff9a62; --warn-soft: #3d1f10; --good: #4fd193; --good-soft: #0f3324;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f17; --surface: #131a27; --ink: #e7ebf2; --muted: #97a1b3; --line: #253045;
  --accent: #7d97ff; --accent-soft: #1c2647; --t3-soft: #1e2635;
  --warn: #ff9a62; --warn-soft: #3d1f10; --good: #4fd193; --good-soft: #0f3324;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; font-weight: 600; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.note { font-size: 0.8rem; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

header { display: flex; flex-direction: column; gap: 4px; }
nav.tabs { display: flex; gap: 4px; margin: 18px 0 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
nav.tabs button { font: 600 0.9rem var(--font-body); color: var(--muted); background: none; border: 0;
  padding: 10px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.answer { padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }
.headline { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.3; font-weight: 600; margin: 0; text-wrap: balance; }
.headline b { color: var(--accent); font-weight: 700; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { font: 500 0.82rem var(--font-body); background: var(--surface); color: var(--muted); border: 0; padding: 6px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.seg .num { font-size: 0.72rem; opacity: 0.8; margin-left: 4px; }

.plays { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.play { text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
.play:hover { border-color: var(--accent); }
.play[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.play .who { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.play h3 { font: 600 1.05rem var(--font-display); margin: 0; }
.play .usd { font: 700 1.7rem/1.1 var(--font-display); color: var(--accent); }
.play .n { font-size: 0.85rem; color: var(--muted); }
.play .why { font-size: 0.86rem; }
.play .flag { font-size: 0.8rem; color: var(--warn); }

.bar { display: flex; gap: 12px 24px; flex-wrap: wrap; align-items: center; justify-content: space-between; font-size: 0.86rem; }
.risk { color: var(--warn); max-width: 80ch; }
.lever { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.rank { color: var(--muted); font-family: var(--font-data); width: 2em; }
.acct { font-weight: 600; }
.meta { color: var(--muted); font-size: 0.8rem; }
.demo { font-size: 0.8rem; color: var(--good); }
.trend { font-size: 0.75rem; margin-left: 4px; }
.trend.up { color: var(--good); } .trend.down { color: var(--warn); }
.list { margin-top: 20px; }
.foot { margin-top: 14px; }

@media (max-width: 960px) { .plays { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) {
  .plays { grid-template-columns: minmax(0, 1fr); }
  .headline { font-size: 1.25rem; }
  .answer { padding: 18px 16px; }
}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Expansion plan for Q1 2027 · data as of <span id="asof"></span></span>
    <h1>Expansion Priorities Q1 2027</h1>
  </header>

  <div class="card answer" style="margin-top:20px" aria-live="polite">
    <div class="filters">
      <div class="seg" role="group" aria-label="Region" id="f-region"></div>
      <div class="seg" role="group" aria-label="Segment" id="f-seg"></div>
    </div>
    <p class="headline" id="headline"></p>
    <div class="plays" id="plays"></div>
    <div class="bar">
      <span class="risk" id="risk"></span>
      <span class="lever">Peer price
        <span class="seg" role="group" aria-label="Peer price" id="bench"><button data-v="median">Median</button><button data-v="low">Cautious</button></span>
      </span>
    </div>
  </div>

  <div class="card list">
    <div class="card-head"><h2 id="list-title"></h2><span class="note" id="list-step"></span></div>
    <div class="scroll">
      <table>
        <thead><tr><th>#</th><th>Account</th><th>Why</th><th class="r">Active users</th><th>Owner</th><th class="r" id="usd-head">$ at stake</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <p class="note foot" id="foot"></p>
</div>

<script>
const DATA = /*DATA*/null;
</script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const money = v => v >= 1e6 ? "$" + (v / 1e6).toFixed(1) + "M" : v >= 500 ? "$" + Math.round(v / 1000) + "k" : "<$1k";
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const short = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(Math.round(n));
  $("asof").textContent = new Date(DATA.asOf + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

  const within6 = Math.round(DATA.facts.expansionWithin6Months * 100);
  // The four plays. "recover" joins two tracks: contract check and win-back. Renewal $ is revenue coming up, not added to the total.
  const PLAYS = [
    { key: "price", plays: ["price"], title: "Price to usage", who: "Sales",
      why: "They pay less per active user than peers in their segment.", step: "Next step: pricing conversation, biggest gap first.",
      usd: "Gap to peer price, per year", inTotal: true },
    { key: "land", plays: ["land"], title: "Land and expand", who: "Customer Success",
      why: `${within6}% of past expansion deals opened within 6 months of the first deal.`, step: "Next step: expansion call. From now on, every new customer gets one by day 90.",
      usd: "One typical expansion deal", inTotal: true },
    { key: "renewal", plays: ["renewal"], title: "Expand at renewal", who: "Sales + Customer Success",
      why: "Their deals from Q1 2026 come up again in Q1 2027.", flag: "No contract end date in the CRM: confirm the dates.",
      step: "Next step: put expansion on the renewal agenda.", usd: "Revenue renewing", inTotal: false },
    { key: "recover", plays: ["contract", "winback"], title: "Recover revenue", who: "RevOps + Finance, CS",
      why: "They use the product without a current contract.", flag: "Either the CRM is missing deals, or they use us for free.",
      step: "Next step: RevOps confirms contracts; Customer Success wins back lost renewals.", usd: "Usage at peer price, per year", inTotal: true },
  ];
  let F = { region: "all", segment: "all", bench: DATA.benchmark, play: "price" };

  function render() {
    const all = DATA.plays[F.bench];
    const pick = r => (F.region === "all" || r.region === F.region) && (F.segment === "all" || r.segment === F.segment);
    const rows = all.filter(pick);
    const of = p => rows.filter(r => p.plays.includes(r.play)).sort((a, b) => b.atStake - a.atStake);
    const sum = list => list.reduce((a, r) => a + r.atStake, 0);

    // Filters show account counts
    const ids = list => new Set(list.map(r => r.id)).size;
    const opt = (key, v, label) => {
      const g = all.filter(r => (key === "region" ? (F.segment === "all" || r.segment === F.segment) : (F.region === "all" || r.region === F.region)) && (v === "all" || r[key] === v));
      return `<button data-v="${v}" aria-pressed="${F[key] === v}">${label}<span class="num">${ids(g)}</span></button>`;
    };
    $("f-region").innerHTML = [["all", "All regions"], ["NA", "NA"], ["EMEA", "EMEA"], ["APAC", "APAC"]].map(([v, l]) => opt("region", v, l)).join("");
    $("f-seg").innerHTML = [["all", "All segments"], ["Enterprise", "Enterprise"], ["Mid-Market", "Mid-Market"], ["SMB", "SMB"]].map(([v, l]) => opt("segment", v, l)).join("");
    document.querySelectorAll("#bench button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === F.bench));

    // Headline: the money on the table (renewal revenue not added, it's already ours)
    const total = sum(PLAYS.filter(p => p.inTotal).flatMap(of));
    const scope = [F.segment !== "all" ? F.segment : "", F.region !== "all" ? F.region : ""].filter(Boolean).join(" ");
    const renewing = sum(of(PLAYS.find(p => !p.inTotal)));
    $("headline").innerHTML = `Q1 2027: four plays on <b>${ids(rows)}${scope ? " " + esc(scope) : ""} accounts</b>. <b>${money(total)}</b> is on the table, and ${money(renewing)} comes up for renewal.`;

    $("plays").innerHTML = PLAYS.map(p => {
      const list = of(p);
      return `<button class="play" data-k="${p.key}" aria-pressed="${F.play === p.key}">
        <span class="who">${p.who}</span><h3>${p.title}</h3>
        <span class="usd">${money(sum(list))}</span><span class="n">${list.length} accounts · ${p.usd.toLowerCase()}</span>
        <span class="why">${p.why}</span>${p.flag ? `<span class="flag">⚠ ${p.flag}</span>` : ""}</button>`;
    }).join("");

    $("risk").textContent = `⚠ Also: ${DATA.noUsage.accounts} paying accounts (${money(DATA.noUsage.paidUsd)} paid so far) show no product usage. Customer Success fixes the product link before their renewals.`;

    // The accounts behind the selected play
    const P = PLAYS.find(p => p.key === F.play), list = of(P);
    $("list-title").textContent = `${P.title}: ${list.length} accounts · ${money(sum(list))}`;
    $("list-step").textContent = P.step;
    $("usd-head").textContent = P.usd;
    $("rows").innerHTML = list.map((r, i) => {
      const trend = r.growth == null ? "" : `<span class="trend ${r.growth >= 0 ? "up" : "down"}">${r.growth >= 0 ? "▲" : "▼"}${Math.abs(Math.round(r.growth * 100))}%</span>`;
      return `<tr><td class="rank">${i + 1}</td>
        <td><div class="acct">${esc(r.name)}</div><div class="meta">${esc(r.segment)} · ${esc(r.region)}</div></td>
        <td>${esc(r.fact)}${r.demo ? `<div class="demo">${esc(r.demo)}</div>` : ""}</td>
        <td class="r num">${r.users ? short(r.users) + trend : '<span class="meta">no data</span>'}</td>
        <td class="meta">${esc(r.owner)}</td>
        <td class="r num">${money(r.atStake)}</td></tr>`;
    }).join("") || '<tr><td colspan="6" class="note">No accounts in this filter.</td></tr>';

    const b = Object.entries(DATA.bookedByQuarter).slice(-3).map(([, v]) => money(v));
    $("foot").textContent = `$ at stake is money on the table, not a forecast. For scale: expansion booked ${b.join(", ")} in each of the last three quarters.`;
  }

  $("plays").addEventListener("click", e => { const b = e.target.closest(".play"); if (b) { F.play = b.dataset.k; render(); } });
  $("f-region").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { F.region = b.dataset.v; render(); } });
  $("f-seg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { F.segment = b.dataset.v; render(); } });
  $("bench").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { F.bench = b.dataset.v; render(); } });
  render();
})();
</script>
